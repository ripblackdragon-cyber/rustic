name: Development build

on:
  push:
    branches: ["arena/f8eaa5d8-rustic"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Java 25 / Fabric 26.3 (development only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify preserved originals and offline checks
        run: |
          python3 tools/verify_upstream.py
          python3 -m unittest discover -s tests -v
      - name: Compile development mod
        id: gradle
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --stacktrace --no-daemon 2>&1 | tee "$RUNNER_TEMP/rustic-gradle-build.log"
      - name: Verify Minecraft GameTest results
        run: python3 tools/check_gametest_results.py
      - name: Verify Java unit test results
        run: python3 tools/check_junit_results.py
      - name: Verify development JAR packaging
        run: python3 tools/check_development_jar.py
      - name: Annotate build failure
        if: failure() && steps.gradle.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'rustic-gradle-build.log'
          if not path.is_file():
              print('::error::Build log not available; inspect the earlier step.')
          else:
              lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
              found = []
              for i, line in enumerate(lines):
                  if ('What went wrong:' in line or ' error:' in line or
                      'Could not resolve' in line or 'Could not find' in line or
                      'GAME TEST' in line or 'GameTest' in line or '[ERROR]' in line):
                      found.extend(lines[i:i+4])
              for line in (found[:40] or lines[-15:]):
                  line = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + line[:1500])
          for report in Path('build/reports').glob('*gametest*.xml'):
              print('::notice::GameTest report ' + report.read_text(encoding='utf-8').replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')[:5000])
          for xml in (Path('build/test-results/test')).glob('TEST-*.xml'):
              import xml.etree.ElementTree as ET
              root = ET.parse(xml).getroot()
              for case in root.findall('testcase'):
                  for failure in case.findall('failure') + case.findall('error'):
                      text = (failure.text or failure.get('message', ''))[:1500]
                      text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                      print('::error::JUnit ' + case.get('name', '') + ': ' + text)
          PY
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustic-minecraft-test-reports
          path: |
            build/reports/rustic-gametest.xml
            build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Upload development JARs
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustic-fabric-26.3-development
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

  client-game-test:
    name: Minecraft 26.3 singleplayer client test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare software graphics
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils libegl1 libegl-mesa0 libgles2 mesa-vulkan-drivers
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1280x720x24' glxinfo -B
      - name: Run Minecraft client and integrated-server test
        id: client
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEODRIVER: x11
          SDL_VIDEO_FORCE_EGL: '1'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=15s 360s xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew runClientGameTest -PacceptMinecraftEula=true --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/rustic-client.log"
          grep -Fx 'rustic-client-dedicated-gametest-passed' build/reports/rustic-client-gametest.txt
          echo '::notice::Minecraft client tested foods on integrated and dedicated servers and reconnected with persistent inventory/hunger.'
      - name: Annotate client failure
        if: failure() && steps.client.outcome == 'failure'
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP']) / 'rustic-client.log'
          lines = log.read_text(encoding='utf-8', errors='replace').splitlines() if log.exists() else ['Client log missing']
          game_log = Path('build/run/clientGameTest/logs/latest.log')
          if game_log.is_file():
              lines += ['--- client latest.log ---'] + game_log.read_text(encoding='utf-8', errors='replace').splitlines()[-60:]
          message = '\n'.join(lines[-120:])[-24000:]
          print('::error::' + message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - name: Upload client screenshot
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustic-client-gametest-screenshot
          path: build/run/clientGameTest/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
