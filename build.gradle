plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = project.maven_group
version = project.mod_version
base.archivesName = project.archives_base_name

repositories {
    // Loom provides the Minecraft and Fabric repositories.
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

// EULA acceptance is opt-in and only used in the disposable client test run.
// Server GameTests run in their own source set without accepting the EULA.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "rustic_gametest"
        enableClientGameTests = true
        eula = providers.gradleProperty('acceptMinecraftEula').map { it == 'true' }.orElse(false).get()
    }
}

loom {
    runs {
        gameTest {
            systemProperties.put('fabric-api.gametest.report-file', file('build/reports/rustic-gametest.xml').absolutePath)
        }
        clientGameTest {
            systemProperties.put('fabric.client.gametest.modid', 'rustic_gametest')
            systemProperties.put('rustic.client.report', file('build/reports/rustic-client-gametest.txt').absolutePath)
            systemProperties.put('rustic.testDedicatedServer', providers.gradleProperty('acceptMinecraftEula').map { it == 'true' ? 'true' : 'false' }.orElse('false').get())
        }
    }
}

test {
    useJUnitPlatform()
    systemProperty "fabric.side", "server"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

// Keep provenance notices with any development artifact. The upstream Rustic
// license and attribution still require confirmation before distribution.
tasks.named('jar') {
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
    from('licenses/GRADLE-APACHE-2.0.txt') {
        into 'META-INF/licenses'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
