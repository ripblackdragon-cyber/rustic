plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = project.maven_group
version = project.mod_version
base.archivesName = project.archives_base_name

repositories {
    // Loom provides the Minecraft and Fabric repositories.
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

// Server GameTests run in a separate mod/source set and do not accept an EULA.
// Interactive dedicated-server/client testing remains a separate requirement.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "rustic_gametest"
        enableClientGameTests = false
        eula = false
    }
}

loom {
    runs {
        gameTest {
            systemProperties.put('fabric-api.gametest.report-file', file('build/reports/rustic-gametest.xml').absolutePath)
        }
    }
}

test {
    useJUnitPlatform()
    systemProperty "fabric.side", "server"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

// Keep provenance notices with any development artifact. The upstream Rustic
// license and attribution still require confirmation before distribution.
tasks.named('jar') {
    from('THIRD_PARTY_NOTICES.md') {
        into 'META-INF'
    }
    from('licenses/GRADLE-APACHE-2.0.txt') {
        into 'META-INF/licenses'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
